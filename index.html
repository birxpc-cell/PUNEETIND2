    <style>
        :root {
            --bg-color: #070b14;
            --card-bg: rgba(15, 23, 42, 0.75);
            --primary-cyan: #00f2fe;
            --secondary-blue: #4facfe;
            --accent-green: #00ff87;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --border-glow: rgba(0, 242, 254, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.12) 0%, transparent 65%),
                radial-gradient(circle at 50% 100%, rgba(0, 255, 135, 0.08) 0%, transparent 65%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 16px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 28px 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 25px rgba(0, 242, 254, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 18px;
            position: relative;
        }

        /* Badge Header */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid var(--border-glow);
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 800;
            color: var(--primary-cyan);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulse 1.2s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.4; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); }
        }

        /* Profile Section */
        .profile-ring {
            position: relative;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--primary-cyan), var(--accent-green));
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: var(--primary-cyan);
        }

        /* Titles */
        .title-group h1 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title-group p {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 4px;
            font-weight: 500;
        }

        /* Features Box */
        .features-list {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #e2e8f0;
            font-weight: 600;
        }

        .feature-icon {
            color: var(--accent-green);
            font-weight: 900;
        }

        /* Join Button */
        .cta-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px 20px;
            background: linear-gradient(135deg, var(--primary-cyan) 0%, var(--secondary-blue) 100%);
            color: #030712;
            font-size: 17px;
            font-weight: 900;
            text-decoration: none;
            border-radius: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
            animation: btnGlow 2s infinite;
        }

        @keyframes btnGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }
            50% { transform: scale(1.02); box-shadow: 0 0 30px rgba(0, 242, 254, 0.6); }
        }

        /* Timer Section */
        .timer-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            border: 1px dashed var(--border-glow);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .timer-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
        }

        .timer-counter {
            font-size: 18px;
            font-weight: 900;
            color: var(--accent-green);
            font-family: monospace;
        }

        /* Footer */
        .footer-text {
            font-size: 10px;
            color: var(--text-sub);
            opacity: 0.6;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Status Badge -->
        <div class="status-badge">
            <span class="pulse-dot"></span> Official Telegram Channel
        </div>

        <!-- Profile Avatar Ring -->
        <div class="profile-ring">
            <div class="profile-img">⚡</div>
        </div>

        <!-- Title -->
        <div class="title-group">
            <h1>GODXSIGNALS</h1>
            <p>Verified Premium Community</p>
        </div>

        <!-- Protection / Key Points -->
        <div class="features-list">
            <div class="feature-item"><span class="feature-icon">✓</span> Free Daily Signals & Updates</div>
            <div class="feature-item"><span class="feature-icon">✓</span> Direct Access to Main VIP Group</div>
            <div class="feature-item"><span class="feature-icon">✓</span> 100% Verified Channel Link</div>
        </div>

        <!-- Main CTA Link (Clean - No Extra Event Tracking) -->
        <a href="https://t.me/+N_CnLh485j9jMTZl" class="cta-button" target="_blank">
            🚀 JOIN TELEGRAM NOW 🚀
        </a>

        <!-- Timer Box -->
        <div class="timer-box">
            <span class="timer-label">FREE ACCESS EXPIRES IN:</span>
            <span class="timer-counter" id="timer">00:15</span>
        </div>

        <!-- Footer -->
        <div class="footer-text">
            © 2026 GODXSIGNALS. All Rights Reserved.
        </div>
    </div>

    <script>
        // 15-second countdown timer
        let timeLeft = 15;
        const timerDisplay = document.getElementById('timer');
        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerDisplay.innerText = "00:00";
            } else {
                timeLeft--;
                timerDisplay.innerText = "00:" + (timeLeft < 10 ? '0' + timeLeft : timeLeft);
            }
        }, 1000);
    </script>

</body>
